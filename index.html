<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kanvas is a free, open-source infinite canvas for plans, scribbles and brainstorming. No account, local-first."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#22242e" media="(prefers-color-scheme: dark)" />
    <title>Kanvas — plans, scribbles &amp; ideas</title>
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem("kanvas:theme")
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
          }
          if (theme === "dark") document.documentElement.classList.add("dark")
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
