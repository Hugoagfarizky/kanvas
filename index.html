<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kanvas is a free, open-source infinite canvas for plans, scribbles and brainstorming. No account, local-first."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kanvas" />
    <meta name="theme-color" content="#f7f5ef" />
    <title>Kanvas — plans, scribbles &amp; ideas</title>
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem("kanvas:theme")
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
          }
          if (theme === "dark") document.documentElement.classList.add("dark")
          document.documentElement.style.colorScheme = theme

          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute("content", theme === "dark" ? "#22242e" : "#f7f5ef")
        } catch (error) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="min-h-full"></div>
    <noscript>
      <div style="max-width: 32rem; margin: 4rem auto; padding: 0 1.5rem; font-family: sans-serif">
        <h1>Kanvas needs JavaScript</h1>
        <p>
          This canvas renders locally in your browser. Enable JavaScript to create and open boards.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
